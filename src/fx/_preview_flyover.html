<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>flyover preview</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
<style>
  html,body{margin:0;height:100%;background:#0a1622;overflow:hidden;font:12px/1.4 -apple-system,monospace;color:#cde}
  canvas{display:block}
  #hud{position:fixed;top:8px;left:8px;background:#0009;padding:8px 10px;border-radius:6px;
       max-width:440px;max-height:90vh;overflow:auto;white-space:pre-wrap;z-index:2}
  #ctl{position:fixed;top:8px;right:8px;z-index:2;background:#0009;padding:8px;border-radius:6px}
  button{font:inherit;margin:2px 4px 2px 0;padding:4px 8px}
  .miss{color:#7cffb0}
  .bad{color:#ff8a7c}
</style>
</head>
<body>
<div id="hud">loading…</div>
<div id="ctl">
  <div><button id="go">Start strike (heading=0, toward camera)</button></div>
  <div><button id="go2">Random heading / count</button></div>
  <div><button id="stop">Abort</button></div>
</div>
<script type="module">
import * as THREE from 'three';

let Flyover;
try {
  if(new URLSearchParams(location.search).has('placeholder')) throw new Error('forced preview fallback');
  ({ Flyover } = await import('./flyover.js'));
} catch(error) {
  // Keep this isolated preview usable if f18.js is temporarily absent while
  // another contributor is building it. The production module stays strict.
  const fallbackSource = `
    import * as THREE from 'three';
    export function buildF18(){
      const group = new THREE.Group();
      const mat = new THREE.MeshStandardMaterial({color:0x343a40});
      group.add(new THREE.Mesh(new THREE.BoxGeometry(1.5,1,15),mat));
      group.add(new THREE.Mesh(new THREE.BoxGeometry(11,0.25,3),mat));
      const pylons = [-4,-2,2,4].map(x => {
        const p = new THREE.Object3D(); p.position.set(x,-0.7,0); group.add(p); return p;
      });
      return {group,pylons,length:15,span:11,setBurner(){},setSurfaces(){},
        dispose(){ group.traverse(o => o.geometry?.dispose?.()); mat.dispose(); }};
    }
  `;
  const f18Url = URL.createObjectURL(new Blob([fallbackSource], { type:'text/javascript' }));
  const source = await (await fetch('./flyover.js')).text();
  const patched = source.replace("from './f18.js'", `from '${f18Url}'`);
  const flyoverUrl = URL.createObjectURL(new Blob([patched], { type:'text/javascript' }));
  ({ Flyover } = await import(flyoverUrl));
  URL.revokeObjectURL(flyoverUrl); URL.revokeObjectURL(f18Url);
  console.warn('f18.js unavailable; using the preview-only box aircraft', error);
}

const hud = document.getElementById('hud');
const lines = [];
function log(s){
  lines.unshift(s);
  if(lines.length > 30) lines.length = 30;
  hud.innerHTML = lines.join('\n');
  console.log(s);
}

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fd0e8);
scene.fog = new THREE.Fog(0x9fd0e8, 3000, 9000);
scene.add(new THREE.AmbientLight(0xffffff, 0.65));
const sun = new THREE.DirectionalLight(0xfff2d8, 1.0);
sun.position.set(300, 600, 200);
scene.add(sun);

// crude sea stand-in — a flat plane. This page doesn't depend on ocean.js.
const sea = new THREE.Mesh(new THREE.PlaneGeometry(30000, 30000),
  new THREE.MeshStandardMaterial({ color: 0x14587a }));
sea.rotation.x = -Math.PI / 2;
scene.add(sea);

const TARGET = new THREE.Vector3(0, 0, 0);
const marker = new THREE.Mesh(new THREE.RingGeometry(3, 4, 24), new THREE.MeshBasicMaterial({ color: 0xffcf4d }));
marker.rotation.x = -Math.PI / 2; marker.position.copy(TARGET);
scene.add(marker);
for(let i = 0; i < 8; i++){
  // scattered debris on the water so distance/scale reads
  const b = new THREE.Mesh(new THREE.BoxGeometry(2, 1, 2), new THREE.MeshStandardMaterial({ color: 0x334455 }));
  b.position.set((Math.random()-0.5)*600, 0.5, (Math.random()-0.5)*600 - 200);
  scene.add(b);
}

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.5, 20000);
camera.position.set(0, 12, 160);
camera.lookAt(0, 80, -1000);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
document.body.appendChild(renderer.domElement);
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// stub audio — just logs what would have played
const audio = {
  jet(gain, dur){ log(`audio.jet(gain=${gain.toFixed(2)}, dur=${dur.toFixed(1)}s)`); },
  whistle(delay){ log(`audio.whistle(${(delay||0).toFixed(2)})`); },
};

// stub hanging store — a small dark cylinder, like a bomb body
function makeStore(){
  return new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 1.6, 6),
    new THREE.MeshStandardMaterial({ color: 0x1c1e20 }));
}

const flyover = new Flyover(scene, { audio, makeStore });

// Deterministic, off-screen contract test. It advances the Flyover and every
// released bomb at the same fixed timestep, using the orchestrator's two exact
// integration statements, so a browser test does not depend on tab throttling.
function runNumericalProof(){
  const proofScene = new THREE.Scene();
  const proof = new Flyover(proofScene, { makeStore });
  const dt = 1 / 60;
  const bombs = [];
  const misses = [];
  const releases = [];
  let passCount = 0, surfaceCalls = 0, finite = true, sawEgress = false;
  let burnerPeak = 0, maxAway = 0, maxAltitude = 0, maxBank = 0, maxPitch = 0;

  const setBurner = proof.craft.setBurner.bind(proof.craft);
  proof.craft.setBurner = v => { burnerPeak = Math.max(burnerPeak, v); setBurner(v); };
  const setSurfaces = proof.craft.setSurfaces.bind(proof.craft);
  proof.craft.setSurfaces = values => { surfaceCalls++; setSurfaces(values); };
  proof.onPass = () => { passCount++; };
  proof.onRelease = (pos, vel, index) => {
    releases.push({ index, y: pos.y, speed: vel.length(), vy: vel.y,
      storeDetached: !proof.stores[index]?.attached });
    bombs.push({ pos: pos.clone(), vel: vel.clone(), index,
      planned: proof.plannedImpacts[index].clone() });
  };

  proof.start({ target: TARGET, count: 3, spacing: 45, heading: 0, altitude: 500, speed: 250 });
  const storesAtStart = proof.stores.filter(s => s.attached && s.obj.visible).length;
  for(let frame = 0; frame < 60 * 55; frame++){
    proof.update(dt, camera.position);
    if(proof.run){
      sawEgress ||= proof.run.phase === 'egress';
      maxAway = Math.max(maxAway, Math.hypot(proof.run.pos.x, proof.run.pos.z));
      maxAltitude = Math.max(maxAltitude, proof.run.pos.y);
      maxBank = Math.max(maxBank, Math.abs(proof.run.bank));
      maxPitch = Math.max(maxPitch, Math.abs(proof.run.pitch));
      finite &&= Number.isFinite(proof.run.pos.x + proof.run.pos.y + proof.run.pos.z);
    }
    for(let i = bombs.length - 1; i >= 0; i--){
      const b = bombs[i];
      b.vel.y -= G * dt;
      b.pos.addScaledVector(b.vel, dt);
      finite &&= Number.isFinite(b.pos.x + b.pos.y + b.pos.z);
      if(b.pos.y <= 0){
        misses[b.index] = Math.hypot(b.pos.x - b.planned.x, b.pos.z - b.planned.z);
        bombs.splice(i, 1);
      }
    }
  }

  const report = {
    dt, misses, releases, passCount, storesAtStart,
    storesAfterRelease: proof.stores.filter(s => s.attached).length,
    sawEgress, burnerPeak, surfaceCalls, finite,
    maxAway, maxAltitude, maxBank, maxPitch, despawned: !proof.active,
  };
  window.__flyoverProof = report;
  log(`PROOF miss distances: ${misses.map(m => `${m.toFixed(3)}m`).join(', ')}`);
  log(`PROOF pass=${passCount} stores=${storesAtStart}->${report.storesAfterRelease} `
    + `egress=${sawEgress} burner=${burnerPeak} despawn=${report.despawned} finite=${finite}`);
  log(`PROOF bank=${THREE.MathUtils.radToDeg(maxBank).toFixed(1)}° `
    + `climb=${THREE.MathUtils.radToDeg(maxPitch).toFixed(1)}° surfaces=${surfaceCalls}`);
  proof.dispose();
  return report;
}

// ── ballistics proof: integrate every released bomb with the EXACT
// orchestrator model (no drag) and measure the landing miss distance ──
const G = 9.81;
const testBombs = [];
const markers = [];

flyover.onPass = () => log('onPass() — abeam target');
flyover.onRelease = (pos, vel, i) => {
  log(`release[${i}] pos=(${pos.x.toFixed(0)},${pos.y.toFixed(0)},${pos.z.toFixed(0)}) `
    + `speed=${vel.length().toFixed(1)} vy=${vel.y.toFixed(3)}`);
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(1.4, 8, 6), new THREE.MeshStandardMaterial({ color: 0xff5a3c }));
  mesh.position.copy(pos);
  scene.add(mesh);
  testBombs.push({ mesh, pos: pos.clone(), vel: vel.clone(), index: i, planned: flyover.plannedImpacts[i].clone() });
};

function clearMarkers(){
  for(const m of markers) scene.remove(m);
  markers.length = 0;
}

document.getElementById('go').onclick = () => {
  clearMarkers();
  flyover.start({ target: TARGET, count: 3, spacing: 45, heading: 0 });
  log('=== strike started (heading=0) — plannedImpacts:');
  flyover.plannedImpacts.forEach((p, i) => log(`  [${i}] (${p.x.toFixed(1)}, ${p.z.toFixed(1)})`));
};
document.getElementById('go2').onclick = () => {
  clearMarkers();
  const count = THREE.MathUtils.randInt(2, 5);
  const heading = Math.random() * Math.PI * 2;
  flyover.start({ target: TARGET, count, spacing: 40 + Math.random()*20, heading });
  log(`=== strike started (heading=${heading.toFixed(2)}, count=${count})`);
};
document.getElementById('stop').onclick = () => { flyover.abort(); log('aborted'); };

let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;

  flyover.update(dt, camera.position);

  // step the verification bombs with the orchestrator's exact model
  for(let i = testBombs.length - 1; i >= 0; i--){
    const b = testBombs[i];
    b.vel.y -= G * dt;
    b.pos.addScaledVector(b.vel, dt);
    b.mesh.position.copy(b.pos);
    if(b.pos.y <= 0){
      const miss = Math.hypot(b.pos.x - b.planned.x, b.pos.z - b.planned.z);
      log(`<span class="${miss < 5 ? 'miss' : 'bad'}">IMPACT[${b.index}] miss = ${miss.toFixed(2)} m</span>`);
      const ring = new THREE.Mesh(new THREE.RingGeometry(1.5, 2, 16), new THREE.MeshBasicMaterial({ color: 0x4dff9c }));
      ring.rotation.x = -Math.PI / 2; ring.position.set(b.pos.x, 0.1, b.pos.z);
      scene.add(ring); markers.push(ring);
      scene.remove(b.mesh);
      testBombs.splice(i, 1);
    }
  }

  if(flyover.active && flyover.craft?.group.visible) camera.lookAt(flyover.craft.group.position);
  else camera.lookAt(TARGET.x, 80, TARGET.z - 500);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
runNumericalProof();
log('ready — click "Start strike"');
</script>
</body>
</html>
