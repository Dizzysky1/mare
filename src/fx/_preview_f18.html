<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>f18 preview</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
<style>
  html,body{ margin:0; height:100%; background:#dfe9f0; overflow:hidden; font-family:sans-serif; }
  #hud{ position:fixed; top:8px; left:8px; color:#223; font-size:13px; background:rgba(255,255,255,0.75); padding:8px 10px; border-radius:6px; line-height:1.5; z-index:10; }
  button{ margin-right:6px; }
</style>
</head>
<body>
<div id="hud">
  <div id="info">loading…</div>
  <div>
    <button data-view="side">side</button>
    <button data-view="top">top</button>
    <button data-view="front">nose</button>
    <button data-view="rear">rear</button>
    <button data-view="tail">tail close</button>
    <button data-view="threeq">3/4</button>
    <button data-view="orbit">orbit</button>
  </div>
  <div>
    <button id="burnerOff">burner 0</button>
    <button id="burnerOn">burner 1</button>
  </div>
  <div>
    <button id="surfDeflect">deflect surfaces</button>
    <button id="surfNeutral">neutral</button>
  </div>
</div>
<canvas id="view"></canvas>
<script type="module">
import * as THREE from 'three';
import { buildF18 } from './f18.js?v=3';

const canvas = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe9f0);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.5, 500);

const hemi = new THREE.HemisphereLight(0xffffff, 0x445566, 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(30, 40, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left = -20; sun.shadow.camera.right = 20;
sun.shadow.camera.top = 20; sun.shadow.camera.bottom = -20;
sun.shadow.camera.far = 120;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xaaccff, 0.5);
fill.position.set(-20, 10, -20);
scene.add(fill);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(200,200), new THREE.MeshStandardMaterial({color:0xb9c7bd, roughness:1}));
ground.rotation.x = -Math.PI/2;
ground.position.y = -6;
ground.receiveShadow = true;
scene.add(ground);

const jet = buildF18({ scale: 1 });
scene.add(jet.group);
window._three = { scene, camera, jet, renderer };
let triangles = 0;
jet.group.traverse(o => {
  if(!o.isMesh) return;
  const g = o.geometry;
  triangles += g.index ? g.index.count/3 : g.attributes.position.count/3;
});
document.getElementById('info').textContent = `F/A-18 built — length ${jet.length.toFixed(1)}m, span ${jet.span.toFixed(1)}m, pylons ${jet.pylons.length}, ${triangles} tris`;

// mark pylon anchors so they're checkable in screenshots
const markerGeo = new THREE.SphereGeometry(0.12, 8, 6);
const markerMat = new THREE.MeshBasicMaterial({ color:0xff2244 });
for(const p of jet.pylons){
  const m = new THREE.Mesh(markerGeo, markerMat);
  p.add(m);
}

let mode = 'orbit';
let t = 0;
const views = {
  side:   () => { camera.position.set(22, 1, 0); camera.lookAt(0,0,0); },
  top:    () => { camera.position.set(0, 22, 0.01); camera.lookAt(0,0,0); },
  front:  () => { camera.position.set(0, 1, 20); camera.lookAt(0,0,0); },
  rear:   () => { camera.position.set(0, 1, -20); camera.lookAt(0,0,0); },
  tail:   () => { camera.position.set(5.5, 3.2, -14); camera.lookAt(0,0.4,-5.8); },
  threeq: () => { camera.position.set(14, 7, 14); camera.lookAt(0,0,0); },
};
views.threeq();

for(const btn of document.querySelectorAll('button[data-view]')){
  btn.onclick = () => { mode = btn.dataset.view; if(views[mode]) views[mode](); };
}
document.getElementById('burnerOff').onclick = () => jet.setBurner(0);
document.getElementById('burnerOn').onclick = () => jet.setBurner(1);
document.getElementById('surfDeflect').onclick = () => jet.setSurfaces({ aileron:1, elevator:-1, rudder:1 });
document.getElementById('surfNeutral').onclick = () => jet.setSurfaces({ aileron:0, elevator:0, rudder:0 });

function animate(){
  requestAnimationFrame(animate);
  t += 0.01;
  if(mode === 'orbit'){
    camera.position.set(Math.sin(t)*16, 6, Math.cos(t)*16);
    camera.lookAt(0,0,0);
  }
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
